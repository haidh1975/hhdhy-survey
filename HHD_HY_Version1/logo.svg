<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a89dc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="200" height="200" rx="40" fill="url(#grad1)"/>
  
  <!-- HHD Letter Shapes -->
  <g fill="white">
    <!-- H Shape -->
    <rect x="50" y="60" width="15" height="80" rx="5"/>
    <rect x="85" y="60" width="15" height="80" rx="5"/>
    <rect x="50" y="90" width="50" height="15" rx="5"/>
    
    <!-- H Shape (Second) -->
    <rect x="110" y="60" width="15" height="80" rx="5"/>
    <rect x="145" y="60" width="15" height="80" rx="5"/>
    <rect x="110" y="90" width="50" height="15" rx="5"/>
    
    <!-- Small Diamond (Y) -->
    <path d="M100 10 L120 40 L100 70 L80 40 Z" opacity="0.6"/>
  </g>
  
  <!-- Center Decorative Element -->
  <circle cx="100" cy="150" r="20" fill="white" opacity="0.8"/>
  
  <!-- Text -->
  <text x="100" y="155" font-family="Arial" font-weight="bold" font-size="16" fill="#4a89dc" text-anchor="middle">HHD</text>
  
  <!-- Small Version Label -->
  <text x="170" y="185" font-family="Arial" font-weight="bold" font-size="12" fill="white" text-anchor="end">Version 1</text>
</svg>